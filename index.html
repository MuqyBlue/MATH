<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Worksheet Generator</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- ❌ CONTROL PANEL (ไม่ export) -->
  <div class="card controls no-print">
    <select id="operation">
      <option value="add">Addition</option>
      <option value="subtract">Subtraction</option>
      <option value="multiply">Multiplication</option>
      <option value="divide">Division</option>
    </select>

    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <input type="number" id="count" value="10" min="1">
    <input type="number" id="columns" value="2" min="1">

    <button onclick="generate()">Generate</button>
    <button onclick="showAnswers()">Show Answers</button>
    <button onclick="window.print()">Print</button>
    <button id="exportBtn">Export PNG</button>
    <button onclick="exportPDF()">Export PDF</button>
    <button onclick="exportSVG()">Export SVG</button>
  </div>

  <!-- ✅ EXPORT AREA -->
  <div id="exportArea">

    <div class="header">
      <h2>Math Worksheet</h2>
      <p>Name: ________ Date: ________</p>
    </div>

    <div id="worksheet"></div>

    <div id="answerSection"></div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
